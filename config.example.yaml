# QuoteBot v2 configuration — copy to config.yaml and fill in the secrets.
# config.yaml is gitignored so your passwords never end up on GitHub.
#
#   cp config.example.yaml config.yaml
#   nano config.yaml        # fill in the values marked CHANGE ME

icloud:
  email: tombambridge@icloud.com
  # NOT your Apple ID password. Create an app-specific password at
  # https://appleid.apple.com -> Sign-In and Security -> App-Specific Passwords
  app_password: "xxxx-xxxx-xxxx-xxxx"     # CHANGE ME
  imap_host: imap.mail.me.com
  imap_port: 993
  smtp_host: smtp.mail.me.com
  smtp_port: 587

owner:
  notify_email: tombambridge@icloud.com
  command_senders:
    - tombambridge@icloud.com
  imessage_handle: ""       # optional iMessage ping, e.g. "+447700900123"

leads:
  formspree_senders:
    - formspree.io
  field_aliases:            # only add labels your form uses that differ
    name: []
    email: []
    phone: []
    address: []
    property_type: []
    preferred_size: []

# Which proposal backend to use: easypv | pylon
provider: easypv

# Dedicated, isolated Chrome window for Computer Use (shared by all providers) —
# its own user-data-dir + the "QuoteBot" profile, completely separate from your
# everyday Chrome.
chrome:
  binary: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  user_data_dir: "~/quotebot2/chrome-quotebot"
  profile: "QuoteBot"
  settle_seconds: 6         # wait after launch before Computer Use starts

easypv:
  enabled: true
  base_url: https://easy-pv.co.uk
  email: ""                 # CHANGE ME — Easy-PV login email
  password: ""              # CHANGE ME — Easy-PV login password
  api_key: ""               # CHANGE ME — Easy-PV REST API key (X-API-KEY header)
  owner_email: bambridgeelectrical@icloud.com   # projects created under this owner
  poll_interval_seconds: 30
  poll_timeout_seconds: 180
  api_timeout: 30
  # Standard components Computer Use searches by name (override if they change):
  components:
    panels: "Jinko JKM460N 460W"
    inverter: "Solis S5-EH1P5K hybrid"
    batteries: "Dyness H5B G2"
  extra_project_fields: {}  # extra keys for the create-project API payload

# Pylon (getpylon.com) backend — used when provider: pylon.
# NOTE: Pylon's full API reference is gated, so the endpoint/URL/field values
# below are best-effort defaults to CONFIRM against your Pylon account + docs
# (https://getpylon.com/developers/). Adjust them here — no code changes needed.
pylon:
  enabled: true
  base_url: https://api.getpylon.com      # CONFIRM — API base
  app_url: https://app.getpylon.com       # CONFIRM — web-app base (project URLs/login)
  api_token: ""             # CHANGE ME — Pylon API token (Authorization: Bearer)
  email: ""                 # CHANGE ME — Pylon login email (for Computer Use)
  password: ""              # CHANGE ME — Pylon login password
  create_path: /lead_form   # CONFIRM — create-lead/project endpoint
  project_url_template: "{app_url}/projects/{id}"   # CONFIRM — how to open a project
  login_url: ""             # blank = use app_url
  # Map API payload field -> lead field. Set exact Pylon field names here.
  create_field_map:
    name: name
    email: email
    phone: phone
    address: address
    postcode: postcode
  extra_create_fields: {}
  id_field: ""              # response key holding the new id (blank = auto-detect)
  components:
    panels: "Jinko JKM460N 460W"
    inverter: "Solis S5-EH1P5K hybrid"
    batteries: "Dyness H5B G2"
  # Proposal confirmation. Pylon signals "ready" by webhook, which this IMAP
  # daemon can't receive, so:
  #   trust (default) = trust Computer Use completion (can't API-confirm)
  #   poll            = GET proposal_check_path and look for proposal_marker
  confirm_mode: trust
  proposal_check_path: ""
  proposal_id_param: projectId
  proposal_marker: proposal
  poll_interval_seconds: 30
  poll_timeout_seconds: 180
  api_timeout: 30
  # task_override: |        # paste exact Computer Use steps for Pylon's UI here
  #   ...

# Claude Computer Use — sees the Mac screen and completes the design + proposal.
anthropic:
  enabled: true
  api_key: ""               # CHANGE ME (or set the ANTHROPIC_API_KEY env var)
  # Beta header + tool version are derived from the model automatically:
  #   claude-sonnet-4-6 (default) -> computer-use-2025-11-24 / computer_20251124
  #   claude-haiku-4-5  (cheapest, less reliable on complex designs)
  #   claude-opus-4-8 / 4-7 (most accurate, higher cost)
  computer_use_model: claude-sonnet-4-6
  effort: medium            # low | medium | high (medium is best for computer use)
  max_steps: 50             # hard cap on Computer Use actions per proposal
  timeout_seconds: 600      # give up after 10 minutes and fall back to manual
  max_tokens: 4096
  display_number: 1         # macOS display Computer Use drives

pricing:
  panel_wattage_kw: 0.44
  defaults:
    roof_faces: 1
    dc_strings: 1
    scaffold: two_storey

bot:
  poll_seconds: 60
  state_db: state.db
  log_dir: logs
  dry_run: false            # true = skip the proposal provider entirely
