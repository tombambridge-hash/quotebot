# QuoteBot v2 configuration — copy to config.yaml and fill in the secrets.
# config.yaml is gitignored so your passwords never end up on GitHub.
#
#   cp config.example.yaml config.yaml
#   nano config.yaml        # fill in the values marked CHANGE ME

icloud:
  email: tombambridge@icloud.com
  # NOT your Apple ID password. Create an app-specific password at
  # https://appleid.apple.com -> Sign-In and Security -> App-Specific Passwords
  app_password: "xxxx-xxxx-xxxx-xxxx"     # CHANGE ME
  imap_host: imap.mail.me.com
  imap_port: 993
  smtp_host: smtp.mail.me.com
  smtp_port: 587

owner:
  # Where lead summaries / fallback alerts are sent (read everywhere).
  notify_email: tombambridge@icloud.com
  # Only these senders may give the bot commands (subject starting "Bot").
  command_senders:
    - tombambridge@icloud.com
  # Optional iMessage ping when a proposal is ready, e.g. "+447700900123".
  imessage_handle: ""

leads:
  # Emails whose sender contains any of these are treated as website leads.
  formspree_senders:
    - formspree.io
  # Optional: extra labels your Formspree form uses, mapped to canonical fields.
  # The common labels are recognised already; only add ones that differ.
  field_aliases:
    name: []
    email: []
    phone: []
    address: []
    property_type: []
    preferred_size: []

easypv:
  enabled: true
  base_url: https://easy-pv.co.uk
  # Easy-PV login — Computer Use logs in fresh each run using these.
  email: ""                 # CHANGE ME — Easy-PV login email
  password: ""              # CHANGE ME — Easy-PV login password
  # Easy-PV REST API key (sent as the X-API-KEY header) for creating the
  # project and confirming the proposal PDF.
  api_key: ""               # CHANGE ME
  # Every project is created under this owner (must be exactly this address).
  owner_email: bambridgeelectrical@icloud.com
  # Proposal confirmation: poll files/list every 30s for up to 3 minutes.
  poll_interval_seconds: 30
  poll_timeout_seconds: 180
  api_timeout: 30
  # Dedicated, isolated Chrome window for the bot — completely separate from
  # the user's everyday Chrome (its own user-data-dir + the "QuoteBot" profile).
  chrome_binary: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  chrome_user_data_dir: "~/quotebot2/chrome-quotebot"
  chrome_profile: "QuoteBot"
  display_number: 1
  # Optional extra fields merged into the create-project API payload, if your
  # Easy-PV account needs them. e.g. {region: "Wales"}
  extra_project_fields: {}

# Claude Computer Use — sees the Mac screen and completes the Easy-PV design +
# proposal. Get a key at https://console.anthropic.com (pay-as-you-go).
anthropic:
  enabled: true
  api_key: ""               # CHANGE ME (or set the ANTHROPIC_API_KEY env var)
  # Most cost-effective model that supports Computer Use reliably for this kind
  # of multi-step design. The beta header + tool version are derived from the
  # model automatically, so just set the model here:
  #   claude-sonnet-4-6  (default) -> computer-use-2025-11-24 / computer_20251124
  #   claude-haiku-4-5   (cheapest) -> computer-use-2025-01-24 / computer_20250124
  #                       (cheaper, but less reliable on complex roof designs)
  #   claude-opus-4-8 / claude-opus-4-7 -> highest accuracy, higher cost
  computer_use_model: claude-sonnet-4-6
  effort: medium            # low | medium | high  (medium is best for computer use)
  max_steps: 50             # hard cap on Computer Use actions per proposal
  timeout_seconds: 600      # give up after 10 minutes and fall back to manual
  max_tokens: 4096

pricing:
  panel_wattage_kw: 0.44    # used to decide if G99 applies (>3.68kW)
  defaults:
    roof_faces: 1
    dc_strings: 1
    scaffold: two_storey    # bungalow | single_storey_extension | two_storey |
                            # two_storey_complex | three_storey

bot:
  poll_seconds: 60          # how often to check the inbox
  state_db: state.db
  log_dir: logs
  dry_run: false            # true = create project only? no — skips Easy-PV entirely
